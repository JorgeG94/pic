# Thanks to infinity to https://github.com/gha3mi/setup-fortran-conda
# for setting this up. MIT Licensed.
name: Setup Fortran multi OS multi compiler Conda CI/CD

# Run on every branch push for fast developer feedback, and on PRs. The
# concurrency group is keyed by branch name (head_ref on PRs, ref_name on
# pushes) so a push to a branch that already has an open PR collapses into a
# single run instead of building twice.
on:
  push:
  pull_request:
  # Weekly run to catch compiler/toolchain/dependency drift even with no code
  # changes. 12:00 UTC Wednesday = 22:00 Sydney (AEST); drifts to 23:00 during
  # AEDT since GitHub cron cannot follow daylight saving. Scheduled runs fire
  # only on the default branch.
  schedule:
    - cron: '0 12 * * 3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:

  # Run FPM tests on all OS/compiler combinations. PIC is pure Fortran (no
  # MPI/BLAS in this workflow), so the only combos we skip are the ones that
  # do not work upstream:
  #   - ifx has no macOS build
  #   - LLVM flang-new has no conda-forge package on macOS
  #   - LLVM flang-new is not ready on Windows
  #   - ifx on Windows: fpm passes GNU-style `-L` library paths that Intel's
  #     MSVC-based linker ignores, so the dependency libs (test-drive.lib) are
  #     not found (LNK1181). CMake links Intel-on-Windows correctly, so that
  #     combo is still covered by the test_cmake job below.
  #
  # Compiler version pins (see the `include:` blocks below). Both work around
  # broken conda-forge uploads and should be dropped once upstream is fixed:
  #   - flang-new 22.1.8: conda-forge flang 23.1.0 (uploaded 2026-08-27) lists
  #     libllvm23/libclang-cpp23.1 as run deps but not libmlir23, so the driver
  #     dies with "libMLIR.so.23.1: cannot open shared object file" during the
  #     action's compiler verification step.
  #   - gfortran 16.1.0 on Windows: conda-forge rebuilt the whole win-64 GCC
  #     stack as build _4 on 2026-08-25; that gcc cannot find crt2.o and
  #     default-manifest.o from m2w64-sysroot_win-64, so every link fails.
  #     16.1.0 was left at build _3 and still links.
  test_fpm:
    name: ${{ matrix.os }}_${{ matrix.compiler }}_fpm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [gfortran, ifx, flang-new]
        exclude:
          - os: macos-latest
            compiler: ifx
          - os: macos-latest
            compiler: flang-new
          - os: windows-latest
            compiler: flang-new
          - os: windows-latest
            compiler: ifx
        include:
          - compiler: flang-new
            compiler_version: '22.1.8'
          - os: windows-latest
            compiler: gfortran
            compiler_version: '16.1.0'

    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@v0.17.1
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler_version }}
          platform: ${{ matrix.os }}

      - name: fpm versioning
        run: fpm --version

      # macOS gfortran only. The conda toolchain writes the environment's lib
      # directory into the binary's LC_RPATH twice, and dyld refuses to launch
      # a Mach-O image with a duplicate rpath:
      #
      #   dyld: duplicate LC_RPATH '/Users/runner/miniconda3/envs/fortran/lib'
      #
      # The link itself succeeds; every test then dies before its first line
      # runs -- exit 6 under fpm, "Subprocess aborted" for all 46 suites under
      # ctest. It appeared between 2026-10-28 (green) and 2026-11-03 with no
      # commit touching anything it depends on, and it is intermittent: on one
      # run the fpm job survives and the cmake job dies, on the next the other
      # way round.
      #
      # Two sources each add the path, so drop it from the flags conda exports
      # and leave the compiler wrapper as the only one. fpm's printed link line
      # carries no -Wl,-rpath at all, so it is possible the duplicate comes
      # from inside the wrapper instead and this has no effect -- hence the
      # rpath dump afterwards, which names the real source either way rather
      # than leaving the next attempt to guess again. Drop both this and the
      # dump once upstream is fixed.
      - name: fpm test (release)
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.compiler }}" = "gfortran" ]; then
            echo "::group::rpath diagnosis (before)"
            echo "LDFLAGS=${LDFLAGS:-<unset>}"
            echo "FFLAGS=${FFLAGS:-<unset>}"
            echo "FORTRANFLAGS=${FORTRANFLAGS:-<unset>}"
            gfortran -print-prog-name=collect2 || true
            echo "::endgroup::"
            # Strip every -Wl,-rpath,<dir> and -Wl,-rpath -Wl,<dir> pair.
            LDFLAGS=$(printf '%s' "${LDFLAGS:-}" \
                      | sed -E 's/-Wl,-rpath,[^[:space:]]+//g; s/-Wl,-rpath[[:space:]]+-Wl,[^[:space:]]+//g; s/[[:space:]]+/ /g')
            export LDFLAGS
            echo "LDFLAGS now: ${LDFLAGS:-<empty>}"
          fi
          set +e
          fpm test --compiler ${{ matrix.compiler }} --profile release --verbose
          rc=$?
          set -e
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.compiler }}" = "gfortran" ]; then
            echo "::group::rpath diagnosis (after) -- LC_RPATH entries in every built image"
            find build -type f -perm -111 -exec sh -c \
              'file "$1" | grep -q Mach-O || exit 0;
               echo "== $1";
               otool -l "$1" | awk "/LC_RPATH/{f=1} f&&/ path /{print \$2; f=0}"' sh {} \;
            echo "::endgroup::"
          fi
          exit $rc

  # Run CMake + Ninja build/tests across the same OS/compiler matrix.
  test_cmake:
    name: ${{ matrix.os }}_${{ matrix.compiler }}_cmake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [gfortran, ifx, flang-new]
        exclude:
          - os: macos-latest
            compiler: ifx
          - os: macos-latest
            compiler: flang-new
          - os: windows-latest
            compiler: flang-new
        include:
          - compiler: flang-new
            compiler_version: '22.1.8'
          - os: windows-latest
            compiler: gfortran
            compiler_version: '16.1.0'

    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@v0.17.1
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler_version }}
          platform: ${{ matrix.os }}
          extra-packages: "cmake, ninja"

      # macOS gfortran only. The conda toolchain writes the environment's lib
      # directory into the binary's LC_RPATH twice, and dyld refuses to launch
      # a Mach-O image with a duplicate rpath:
      #
      #   dyld: duplicate LC_RPATH '/Users/runner/miniconda3/envs/fortran/lib'
      #
      # The link itself succeeds; every test then dies before its first line
      # runs -- exit 6 under fpm, "Subprocess aborted" for all 46 suites under
      # ctest. It appeared between 2026-10-28 (green) and 2026-11-03 with no
      # commit touching anything it depends on, and it is intermittent: on one
      # run the fpm job survives and the cmake job dies, on the next the other
      # way round.
      #
      # Two sources each add the path, so drop it from the flags conda exports
      # and leave the compiler wrapper as the only one. fpm's printed link line
      # carries no -Wl,-rpath at all, so it is possible the duplicate comes
      # from inside the wrapper instead and this has no effect -- hence the
      # rpath dump afterwards, which names the real source either way rather
      # than leaving the next attempt to guess again. Drop both this and the
      # dump once upstream is fixed.
      - name: cmake test (release)
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.compiler }}" = "gfortran" ]; then
            echo "::group::rpath diagnosis (before)"
            echo "LDFLAGS=${LDFLAGS:-<unset>}"
            echo "FFLAGS=${FFLAGS:-<unset>}"
            echo "FORTRANFLAGS=${FORTRANFLAGS:-<unset>}"
            gfortran -print-prog-name=collect2 || true
            echo "::endgroup::"
            # Strip every -Wl,-rpath,<dir> and -Wl,-rpath -Wl,<dir> pair.
            LDFLAGS=$(printf '%s' "${LDFLAGS:-}" \
                      | sed -E 's/-Wl,-rpath,[^[:space:]]+//g; s/-Wl,-rpath[[:space:]]+-Wl,[^[:space:]]+//g; s/[[:space:]]+/ /g')
            export LDFLAGS
            echo "LDFLAGS now: ${LDFLAGS:-<empty>}"
          fi
          set +e
          cmake -S . -B build/release -DTESTDRIVE_WITH_XDP=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=${{ matrix.compiler }} -G Ninja \
            && cmake --build build/release \
            && ctest --test-dir build/release --output-on-failure
          rc=$?
          set -e
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.compiler }}" = "gfortran" ]; then
            echo "::group::rpath diagnosis (after) -- LC_RPATH entries in every built image"
            find build -type f -perm -111 -exec sh -c \
              'file "$1" | grep -q Mach-O || exit 0;
               echo "== $1";
               otool -l "$1" | awk "/LC_RPATH/{f=1} f&&/ path /{print \$2; f=0}"' sh {} \;
            echo "::endgroup::"
          fi
          exit $rc
