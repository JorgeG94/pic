name: Terminal layer

# The terminal OS layer is the only part of pic with C sources and operating
# system conditionals, and it is off by default so that the main matrix and
# the LFortran jobs never see it. This workflow is what builds and tests it,
# on all three platforms.
#
# All three matters more here than anywhere else in the repository: about
# half of pic_term_os.c is `#if defined(_WIN32)`, and the termios details on
# macOS are the BSD ones rather than Linux's. A green Linux run says nothing
# about either.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'term/**'
      - 'examples/term_keys/**'
      - 'tools/ci/check_term_restores.sh'
      - '.github/workflows/term-ci.yml'
      - 'CMakeLists.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  term:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc

      # Ninja on every platform, not for speed: on windows-latest CMake's
      # default generator is Visual Studio, which cannot drive the gfortran
      # setup-fortran just installed, so configure fails before compiling
      # anything. Ninja is single-config, hence no --config on the build line.
      - name: Install Ninja
        run: pip install --upgrade ninja

      - name: Configure with the terminal layer on
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPIC_ENABLE_TESTING=ON
          -DPIC_ENABLE_TERM=ON

      - name: Build
        run: cmake --build build

      # These must all pass with no terminal attached, which is the case that
      # matters: a library that only behaves when attached to a tty is one
      # that breaks in CI, in a pipe and under nohup.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Linux only. It needs a real pty, which a CI job does not have and
      # script(1) provides -- with Linux's calling convention, not the BSD one
      # macOS ships. The Windows console has no stty to compare against, so
      # there would be nothing to assert there at all.
      #
      # The script refuses to pass if its own negative control cannot tell a
      # raw terminal from a cooked one, so a green result here cannot be
      # vacuous.
      - name: Raw mode is restored after error stop
        if: runner.os == 'Linux'
        run: tools/ci/check_term_restores.sh build/term/pic-term-raw-crash
