name: Deploy FORD docs

on:
  push:
    branches:
      - main

# The built site is handed to GitHub Pages as an artifact instead of being
# committed to a branch.
#
# FORD rewrites every file in the site on every run, and search/search_database.json
# alone is ~7 MB of incompressible JSON, so each deploy used to add a fresh copy
# of the whole site to the gh-pages-docs branch. 138 of those took the repository
# to ~90 MB, and a plain `git clone` fetches every branch -- so anyone cloning pic
# paid for all 138 copies of the docs, even though main's own history across 350
# commits is only 25 MB. Pages storage is not git, so nothing published here
# reaches a clone.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time, and never cancel one that is already
# running: deploy-pages publishes to the live site, so a cancelled run can
# leave the deployment half-finished. Pushes that arrive while one is in
# flight queue instead, and only the newest of them runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install FORD
        run: pip install ford

      - name: Pip install graphviz
        run: pip install graphviz==0.20.1

      - name: Install c++ graphviz backend
        run: sudo apt install graphviz

      - name: Build FORD docs
        run: ford -m "PIC_HAVE_BLAS" ford.md

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/fpm-ford

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
