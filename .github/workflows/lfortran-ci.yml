# Thanks to infinity to https://github.com/gha3mi/setup-fortran-conda
# for setting this up. MIT Licensed.
name: LFORTRAN CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run to catch LFortran/toolchain updates even with no code changes.
  # 12:00 UTC Wednesday = 22:00 Sydney (AEST); drifts to 23:00 during AEDT since
  # GitHub cron cannot follow daylight saving. Scheduled runs fire only on the
  # default branch.
  schedule:
    - cron: '0 12 * * 3'

# LFortran is an alpha compiler and not a production target, so both jobs are
# allowed to go red without blocking merges (continue-on-error). They still run
# the full test suite so we can see regressions.
#
# Coverage split by build system:
#   - fpm  runs in DEBUG. fpm's `--profile release` currently leaks its internal
#     `flag_lfortran_opt` flag name unexpanded to lfortran (fpm bug), so release
#     via fpm is not usable here.
#   - cmake runs in RELEASE (-O3), which gives us the optimized-build coverage.
#     Release also avoids the -g debug-info step that needs llvm-dwarfdump to
#     link the test executable, which is not always present on the runner.

env:
  # Pinned deliberately. `setup-fortran-conda` installs whatever conda-forge
  # currently calls latest, so an upstream release silently changes what this
  # workflow tests -- which is how pic_format, pic_array_hash and
  # pic_soa_particle started failing here without any commit touching them,
  # and why the failure looked like it belonged to whichever PR happened to be
  # open. Bump this on purpose, in its own PR, so the change is attributable
  # to a commit and a regression can be bisected.
  #
  # `env` is deliberately used here rather than a `matrix` entry: the env
  # context is not available when a strategy matrix is evaluated, so a
  # ${{ env.* }} reference there expands to the empty string and silently
  # un-pins the version again.
  LFORTRAN_VERSION: '0.66.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test_fpm:
    name: ${{ matrix.os }}_${{ matrix.compiler }}_fpm
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [lfortran]

    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@v0.17.1
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ env.LFORTRAN_VERSION }}
          platform: ${{ matrix.os }}

      - name: report toolchain versions
        run: |
          lfortran --version
          fpm --version

      - name: Set linker if macOS
        if: matrix.os == 'macos-latest'
        run: echo "LFORTRAN_LINKER=clang" >> $GITHUB_ENV

      - name: fpm build (debug)
        run: fpm build --compiler ${{ matrix.compiler }} --profile debug --verbose --flag "--cpp --std=f23"

      - name: fpm test (debug)
        run: fpm test --compiler ${{ matrix.compiler }} --profile debug --verbose --flag "--cpp --std=f23"

      # Per-suite triage. The whole-binary run above exits
      # -1073740940 == 0xC0000374 == STATUS_HEAP_CORRUPTION on
      # windows-latest while every individual test reports PASSED, so the
      # corruption is only detected when the Windows heap is validated at
      # process teardown. Linux and macOS do not reproduce it: glibc
      # tolerates what the Windows heap rejects.
      #
      # Running each suite in its own process narrows the fault to one
      # suite: a suite that exits 0xC0000374 alone owns the bad
      # free/overrun. Runs only on failure of the step above, and never
      # fails the job itself, so it is pure diagnostics.
      - name: per-suite triage (diagnostic only)
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          # Both the `tests` and `pre_proc_tests` lists are real ctest
          # suites. The sed range below is inclusive of the pre_proc_tests
          # line, so this picks up both; sort -u guards against the overlap.
          suites=$(sed -n '/^set(tests/,/^set(pre_proc_tests/p' test/CMakeLists.txt \
                   | grep -oE '"[a-z0-9_]+"' | tr -d '"' | sort -u)
          if [ -z "$suites" ]; then
            echo "could not extract suite names from test/CMakeLists.txt" >&2
            exit 1
          fi
          echo "extracted $(echo $suites | wc -w) suites"
          echo "=== running each suite in its own process ==="
          failed=""
          for s in $suites; do
            set +e
            fpm test --compiler ${{ matrix.compiler }} --profile debug \
                     --flag "--cpp --std=f23" -- "$s" > "triage-$s.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              printf '  %-32s ok\n' "$s"
            else
              printf '  %-32s EXIT %s\n' "$s" "$rc"
              failed="$failed $s"
              tail -n 20 "triage-$s.log" | sed 's/^/      | /'
            fi
          done
          echo "=== suites that did not exit cleanly:${failed:-  (none)} ==="
          echo
          echo "Exit -1073740940 (0xC0000374) is STATUS_HEAP_CORRUPTION."
          echo "If every suite passes alone, the fault is in teardown after"
          echo "the last suite (main_tests.f90 calls print_asterisk_row and"
          echo "get_knowledge there) or is cumulative across suites."

  test_cmake:
    name: ${{ matrix.os }}_${{ matrix.compiler }}_cmake
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [lfortran]

    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@v0.17.1
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ env.LFORTRAN_VERSION }}
          platform: ${{ matrix.os }}
          extra-packages: "cmake, ninja"

      - name: report toolchain versions
        run: |
          lfortran --version
          cmake --version

      # Release avoids the -g debug info step that requires llvm-dwarfdump.
      - name: cmake test (release)
        run: |
          cmake -S . -B build/release -DTESTDRIVE_WITH_XDP=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=${{ matrix.compiler }} -G Ninja
          cmake --build build/release
          ctest --test-dir build/release --output-on-failure

  # The terminal layer, under LFortran.
  #
  # A separate job rather than a flag on test_cmake, deliberately: this is the
  # first time LFortran compiles `term/` at all, so if the toolchain cannot do
  # it the existing coverage stays green and the failure is legible on its own.
  # `continue-on-error` matches the other LFortran jobs here; flip it off once
  # this has been stable for a few runs.
  #
  # The gap it closes: PIC_ENABLE_TERM is off by default, `term/` lives outside
  # `src/` so fpm never sees it, and no job here ever turned it on. `pic_term`
  # shipped in 0.8.0 and was compiled by exactly one compiler until its first
  # consumer built it with a second and found that `term_read` corrupted the
  # heap -- an automatic-extent actual argument passed to an explicit-shape
  # interop dummy, which gfortran accepts and LFortran 0.66.0 miscompiles.
  test_term:
    name: ${{ matrix.os }}_${{ matrix.compiler }}_term
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        compiler: [lfortran]

    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@v0.17.1
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ env.LFORTRAN_VERSION }}
          platform: ${{ matrix.os }}
          extra-packages: "cmake, ninja"

      - name: report toolchain versions
        run: |
          lfortran --version
          cmake --version

      - name: cmake test with the terminal layer on
        run: |
          cmake -S . -B build/term -G Ninja -DTESTDRIVE_WITH_XDP=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=${{ matrix.compiler }} -DPIC_ENABLE_TESTING=ON -DPIC_ENABLE_TERM=ON
          cmake --build build/term
          ctest --test-dir build/term --output-on-failure
